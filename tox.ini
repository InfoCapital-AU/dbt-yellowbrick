[tox]
skipsdist = True
envlist = py310,py311,py312,py313

# PEP 660 editable installs default to a namespace-package-splitting mode
# that is incompatible with this repo's pkgutil-style dbt/dbt.adapters
# namespace packages, and fail to register the yellowbrick adapter. Force
# the legacy "compat" editable mode for all envs below.
install_command = python -m pip install --config-settings editable_mode=compat {opts} {packages}

[testenv:{unit,py310,py311,py312,py313,py}]
description = unit testing
skip_install = true
passenv =
    DBT_*
    PYTEST_ADDOPTS
commands = {envpython} -m pytest {posargs} tests/unit
deps =
  -rdev-requirements.txt
  -e.

[testenv:{integration,py310,py311,py312,py313,py}-{ yellowbrick }]
description = adapter plugin integration testing
skip_install = true
passenv =
    DBT_*
    YELLOWBRICK_TEST_*
    PYTEST_ADDOPTS
commands =
  yellowbrick: {envpython} -m pytest {posargs} -m profile_yellowbrick tests/integration
  yellowbrick: {envpython} -m pytest {posargs} tests/functional
deps =
  -rdev-requirements.txt
  -e.
